<h1>בדיקת אייקוני שכפול למורה ולתלמידה</h1>
<p>כל ריבוע מציג את שני האיורים (מורה, תלמידה) בדרך אחרת. כתבי לי אילו ריבועים מציגים את שני האיורים.</p>
