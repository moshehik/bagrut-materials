</main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const only=params.get('only');
  const sections=[...document.querySelectorAll('section.style')];
  const bar=document.getElementById('shell-bar'), dots=document.getElementById('dots'), gallery=document.getElementById('gallery');

  // embedded thumbnail mode: show a single style, no chrome
  if(only){
    document.body.style.overflow='hidden';
    bar.remove(); dots.remove(); gallery.remove();
    document.querySelector('main').style.paddingTop='0';
    sections.forEach(s=>{ if(s.id===only) s.classList.add('active'); else s.remove(); });
    return;
  }

  const jump=document.getElementById('jump');
  let idx=Math.max(0,sections.findIndex(s=>'#'+s.id===location.hash));
  if(idx<0) idx=0;

  sections.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=String(i+1).padStart(2,'0')+' — '+(s.dataset.name||s.id);
    jump.appendChild(o);
    const d=document.createElement('button'); d.textContent=i+1; d.title=(i+1)+' · '+(s.dataset.name||''); d.onclick=()=>show(i); dots.appendChild(d);
  });

  function show(i){
    idx=(i+sections.length)%sections.length;
    sections.forEach((s,k)=>s.classList.toggle('active',k===idx));
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===idx));
    const s=sections[idx];
    document.getElementById('curNum').textContent=String(idx+1).padStart(2,'0')+'/'+sections.length;
    document.getElementById('curName').textContent=s.dataset.name||s.id;
    document.getElementById('curDesc').textContent=s.dataset.desc||'';
    jump.value=idx;
    history.replaceState(null,'','#'+s.id);
    document.body.classList.remove('gallery-mode');
    document.getElementById('galleryBtn').classList.remove('on');
    window.scrollTo(0,0);
  }
  document.getElementById('prev').onclick=()=>show(idx-1);
  document.getElementById('next').onclick=()=>show(idx+1);
  document.getElementById('rand').onclick=()=>show(Math.floor(Math.random()*sections.length));
  jump.onchange=()=>show(+jump.value);

  // gallery
  let galleryBuilt=false;
  function buildGallery(){
    if(galleryBuilt) return; galleryBuilt=true;
    const base=location.href.split('#')[0].split('?')[0];
    sections.forEach((s,i)=>{
      const t=document.createElement('div'); t.className='thumb';
      t.innerHTML='<div class="frame"><iframe loading="lazy" src="'+base+'?only='+s.id+'" title="'+(s.dataset.name||'')+'"></iframe></div>'+
        '<div class="cap"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t">'+(s.dataset.name||s.id)+'</span><span class="d">'+(s.dataset.desc||'')+'</span></div>';
      t.onclick=()=>show(i);
      gallery.appendChild(t);
    });
  }
  function toggleGallery(){
    const on=document.body.classList.toggle('gallery-mode');
    document.getElementById('galleryBtn').classList.toggle('on',on);
    if(on){ buildGallery(); window.scrollTo(0,0); }
  }
  document.getElementById('galleryBtn').onclick=toggleGallery;

  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea')) return;
    if(e.key==='ArrowLeft') show(idx+1);       // RTL: left = forward
    else if(e.key==='ArrowRight') show(idx-1);
    else if(e.key==='g'||e.key==='G') toggleGallery();
    else if(e.key==='r'||e.key==='R') show(Math.floor(Math.random()*sections.length));
    else if(/^[1-9]$/.test(e.key)) show((+e.key-1)*5);   // 1→01, 2→06, 3→11 ... 9→41
  });
  window.addEventListener('hashchange',()=>{const i=sections.findIndex(s=>'#'+s.id===location.hash); if(i>=0&&i!==idx) show(i);});

  show(idx);
})();
</script>
</body>
</html>
