<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>סייר קבצי דרייב — סקיצה</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Gveret+Levin&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   סקיצה: /admin/drive — "סייר קבצי דרייב"
   הטוקנים מועתקים מ-src/app/globals.css ("פנקס המורה"): עט כחול, סימון אדום,
   מרקר חרדל, זית. הפונטים כמו באתר: Assistant (גוף) + גברת לוין (כתב-יד).
   מצב כהה: prefers-color-scheme (באתר האמיתי אין מצב כהה — כאן נגזר מאותם גוונים).
   ===================================================================== */
:root{
  --sea:#33456e; --sea2:#212f4d; --plaster:#fbf9f5; --terra:#b23a2e; --terra-deep:#8a2c22;
  --sun:#d9a441; --ink:#2e2a20;
  --background:var(--plaster); --foreground:var(--ink);
  --blue-soft:#e3e7f0; --pink-soft:#f4e1db; --oak:#6e8b54; --oak-deep:#4f6b3b; --oak-soft:#e6ebdc;
  --gold-soft:#f7ead0; --gold-ink:#7a5712; --card:#ffffff; --muted:#756b57;
  --ring:rgba(51,69,110,.35);
  --rule:rgba(94,186,224,.55); --margin:rgba(178,58,46,.38);
  --line:rgba(46,42,32,.08); --hover:rgba(230,235,220,.55); --input-bg:#fff; --input-bd:rgba(31,45,51,.14);
  --shadow-soft:0 10px 30px rgba(31,45,51,.08); --shadow-lift:0 20px 50px rgba(31,45,51,.18);
  --ease-snap:cubic-bezier(.16,1,.3,1);
  --font-sans:"Assistant",system-ui,sans-serif; --font-hand:"Gveret Levin",cursive;
  --mono:"Courier New","Miriam Fixed",ui-monospace,monospace;
  --paper:#fffdf6; --paper-rule:rgba(94,186,224,.35);
  --ok:#3d7a37; --bad:#b23a2e; --warn-bg:#fff3d6; --warn-bd:#e8cf6a; --warn-ink:#5a4300;
  /* צבעי סוגי קבצים */
  --k-teacher-bg:#e3e7f0; --k-teacher-fg:#212f4d;
  --k-student-bg:#e6ebdc; --k-student-fg:#4f6b3b;
  --k-quiz-bg:#f7ead0;    --k-quiz-fg:#7a5712;
  --k-quizans-bg:#f4e1db; --k-quizans-fg:#8a2c22;
  --k-enrich-bg:#ece6f4;  --k-enrich-fg:#5a3f86;
  --k-summary-bg:#dcefec; --k-summary-fg:#2f6b61;
  --k-slides-bg:#fde9d8;  --k-slides-fg:#9a4b12;
  --k-bagrut-bg:#ebe6d6;  --k-bagrut-fg:#2e2a20;
  --k-other-bg:#ececec;   --k-other-fg:#555;
}
@media (prefers-color-scheme:dark){
  :root{
    --plaster:#15171e; --ink:#ece7da; --background:#15171e; --foreground:#ece7da;
    --sea:#5b78bd; --sea2:#2a3a63; --terra:#e0675a; --terra-deep:#c4493d; --sun:#e2b34f;
    --blue-soft:#273250; --pink-soft:#3b2421; --oak:#8aa96d; --oak-deep:#bcd6a2; --oak-soft:#2b3626;
    --gold-soft:#3b3219; --gold-ink:#f0cf86; --card:#1f222c; --muted:#a59f8e; --ring:rgba(139,166,230,.45);
    --rule:rgba(94,186,224,.09); --margin:rgba(224,103,90,.22);
    --line:rgba(236,231,218,.1); --hover:rgba(139,166,230,.1); --input-bg:#14161c; --input-bd:rgba(236,231,218,.18);
    --shadow-soft:0 10px 30px rgba(0,0,0,.35); --shadow-lift:0 20px 50px rgba(0,0,0,.55);
    --paper:#191b23; --paper-rule:rgba(94,186,224,.1);
    --ok:#8fd486; --bad:#f4857a; --warn-bg:#3b3219; --warn-bd:#6b5a22; --warn-ink:#f0d58b;
    --k-teacher-bg:#273250; --k-teacher-fg:#b8c7ee;
    --k-student-bg:#2b3626; --k-student-fg:#b5d19a;
    --k-quiz-bg:#3b3219;    --k-quiz-fg:#f0cf86;
    --k-quizans-bg:#3b2421; --k-quizans-fg:#f4a79c;
    --k-enrich-bg:#342b47;  --k-enrich-fg:#cdb8f0;
    --k-summary-bg:#1f3a36; --k-summary-fg:#9fdcd0;
    --k-slides-bg:#44291a;  --k-slides-fg:#f5bf94;
    --k-bagrut-bg:#333126;  --k-bagrut-fg:#e0dac6;
    --k-other-bg:#2c2e36;   --k-other-fg:#b6b6bd;
  }
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background-color:var(--background);
  background-image:repeating-linear-gradient(var(--background) 0 35px,var(--rule) 35px 36px);
  background-attachment:fixed; color:var(--foreground); font-family:var(--font-sans);
  font-size:16px; line-height:1.5; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:6px}
@media (prefers-color-scheme:dark){:focus-visible{outline-color:#8fa6e0}}
.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- כלים משותפים (מועתק מהאתר) ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px 16px 14px 18px;box-shadow:var(--shadow-soft)}
.wood{background:linear-gradient(135deg,#33456e,#212f4d)}
.font-display{font-weight:800;letter-spacing:-.01em}
.font-hand{font-family:var(--font-hand);font-weight:400;letter-spacing:.01em}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:9999px;padding:.2rem .7rem;font-size:.78rem;font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:9999px;padding:.45rem 1.05rem;font-size:.875rem;font-weight:700;
  transition:transform .16s var(--ease-snap),box-shadow .16s var(--ease-snap),background .16s var(--ease-snap),opacity .16s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-oak{background:var(--sea2);color:#fff;box-shadow:0 8px 20px rgba(33,47,77,.32)}
.btn-oak:hover{background:var(--sea)}
.btn-primary{background:var(--sea);color:#fff;box-shadow:0 8px 20px rgba(51,69,110,.32)}
.btn-primary:hover{background:var(--sun);color:#2e2a20;box-shadow:0 12px 26px rgba(217,164,65,.45)}
.btn-terra{background:var(--terra);color:#fff;box-shadow:0 8px 20px rgba(178,58,46,.3)}
.btn-ghost{border:2px solid var(--sea);color:var(--sea2)}
.btn-ghost:hover{background:var(--blue-soft)}
@media (prefers-color-scheme:dark){.btn-ghost{color:#c9d5f3;border-color:#5b78bd}.btn-oak{background:#3d56a0}}
.input{width:100%;border-radius:1rem;border:1.5px solid var(--input-bd);background:var(--input-bg);padding:.5rem .9rem;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--sea);box-shadow:0 0 0 4px var(--ring)}
.muted{color:var(--muted)}

/* ---- כותרת אתר (פשוטה) ---- */
.site-h{background:var(--card);border-bottom:1px solid var(--line)}
.site-h .in{max-width:80rem;margin:auto;padding:.7rem 1.5rem;display:flex;align-items:center;gap:1.4rem}
.site-h .logo{font-family:var(--font-hand);font-size:1.6rem;color:var(--sea2)}
@media (prefers-color-scheme:dark){.site-h .logo{color:#c9d5f3}}
.site-h nav{display:flex;gap:1.1rem;font-size:.9rem;font-weight:600;color:var(--muted)}
@media (max-width:640px){.site-h nav{display:none}}

/* ---- פריסת הניהול (admin/layout.tsx) ---- */
.adm{max-width:80rem;margin:auto;padding:2rem 1.5rem}
@media (max-width:640px){.adm{padding:1rem}}
.banner{color:#fff;border-radius:1rem;padding:1.25rem 1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow-soft);display:flex;flex-wrap:wrap;align-items:center;gap:1rem}
.banner small{font-size:.75rem;opacity:.8;display:block}
.banner h1{font-size:1.5rem;line-height:1.3}
.banner .chip{margin-inline-start:auto;background:rgba(255,255,255,.2);color:#fff}
.adm-grid{display:grid;gap:1.5rem;align-items:start;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.adm-grid{grid-template-columns:220px minmax(0,1fr)}}
.anav{padding:.5rem}
@media (min-width:1024px){.anav{position:sticky;top:1rem}}
.anav ul{list-style:none;padding:0;display:flex;gap:.25rem;overflow-x:auto}
@media (min-width:1024px){.anav ul{flex-direction:column;overflow:visible}}
.anav li{flex:none}
.anav a{display:flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.5rem .75rem;font-size:.875rem;font-weight:500;color:color-mix(in srgb,var(--foreground) 80%,transparent);text-decoration:none;transition:background .15s,color .15s}
.anav a:hover{background:var(--hover);color:var(--oak-deep)}
.anav a.on{background:var(--oak-soft);color:var(--oak-deep)}
.anav a .ic{width:1rem;height:1rem}
.anav .new{font-size:.62rem;padding:.05rem .4rem;background:var(--sun);color:#2e2a20;border-radius:99px;font-weight:800;margin-inline-start:auto}

/* ---- כותרת העמוד ---- */
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:1rem}
.page-h h2{font-size:1.5rem;line-height:1.2}
.chip-oak{background:var(--oak-soft);color:var(--oak-deep)}
.chip-blue{background:var(--blue-soft);color:var(--sea2)}
@media (prefers-color-scheme:dark){.chip-blue{color:#c9d5f3}}
.chip-gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip-red{background:var(--terra);color:#fff}
.chip-pink{background:var(--pink-soft);color:var(--terra-deep)}
@media (prefers-color-scheme:dark){.chip-pink{color:#f4a79c}}
.chip-gray{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.sync-note{margin-inline-start:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--oak)}

/* ---- סרגל כלים ---- */
.toolbar{padding:.8rem 1rem;display:grid;gap:.7rem;margin-bottom:1rem}
.tb-row{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem;font-size:.9rem;min-width:0;flex:1 1 280px}
.crumbs button{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:.5rem;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.crumbs button:hover{background:var(--hover);color:var(--oak-deep)}
.crumbs button.last{color:var(--foreground);font-weight:800;cursor:default}
.crumbs .sep{color:var(--muted);opacity:.6;font-size:.8rem}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search .ic{position:absolute;inset-inline-start:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);width:1rem;height:1rem;pointer-events:none}
.search input{padding-inline-start:2.4rem;padding-block:.4rem;font-size:.9rem}
.seg{display:inline-flex;border:1.5px solid var(--input-bd);border-radius:99px;padding:2px;background:var(--input-bg)}
.seg button{display:grid;place-items:center;width:2.1rem;height:1.9rem;border-radius:99px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sea2);color:#fff}
.tb-actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tb-actions .btn{padding:.38rem .9rem;font-size:.82rem}
.tb-actions .btn .ic{width:1rem;height:1rem}
.drawer-btn{display:none}
.hint{font-size:.78rem;color:var(--muted);margin-inline-start:auto}
@media (max-width:900px){.drawer-btn{display:inline-flex}.hint{display:none}}

/* ---- פריסת הסייר ---- */
.xp{display:grid;grid-template-columns:268px minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:900px){.xp{grid-template-columns:minmax(0,1fr)}}

/* עץ תיקיות */
.tree{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto;padding:.6rem .5rem .8rem;scrollbar-width:thin;scrollbar-color:#3d4f7c transparent}
.tree-h{display:flex;align-items:center;gap:.4rem;padding:.2rem .5rem .5rem;font-weight:800;font-size:.9rem}
.tree-h .tiny{margin-inline-start:auto;display:flex;gap:.25rem}
.tiny button{font-size:.72rem;color:var(--muted);padding:.1rem .45rem;border-radius:.4rem}
.tiny button:hover{background:var(--hover);color:var(--oak-deep)}
.tree ul{list-style:none;padding:0}
.trow{--d:0;display:flex;align-items:center;gap:.25rem;padding:.28rem .4rem;padding-inline-start:calc(.3rem + var(--d)*.95rem);border-radius:.6rem;cursor:pointer;font-size:.86rem;font-weight:500;border:1.5px dashed transparent;user-select:none;transition:background .12s}
.trow:hover{background:var(--hover)}
.trow.on{background:var(--oak-soft);color:var(--oak-deep);font-weight:700}
.trow.dragover{background:var(--gold-soft);border-color:var(--sun);color:var(--gold-ink)}
.trow.nodrop{cursor:no-drop;background:color-mix(in srgb,var(--terra) 8%,transparent);border-color:color-mix(in srgb,var(--terra) 40%,transparent)}
.tog{display:grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:.4rem;color:var(--muted);flex:none}
.tog:hover{background:var(--line)}
.tog .ic{transition:transform .18s var(--ease-snap);width:.9rem;height:.9rem}
.tog.open .ic{transform:rotate(-90deg)}
.tog.none{visibility:hidden}
.ticon{display:grid;place-items:center;flex:none;width:1.25rem;font-size:1rem}
.ticon .ic{width:1.05rem;height:1.05rem;color:var(--sun)}
.trow.on .ticon .ic{color:var(--oak-deep)}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:.7rem;font-weight:700;color:var(--muted);background:var(--line);border-radius:99px;padding:0 .45rem;min-width:1.4rem;text-align:center}
.miss{font-size:.66rem;font-weight:800;color:#fff;background:var(--terra);border-radius:99px;padding:.02rem .45rem;white-space:nowrap}
.tsep{height:1px;background:var(--line);margin:.6rem .4rem}
.trow.arch{background:color-mix(in srgb,var(--sun) 10%,transparent)}
.trow.arch.on{background:var(--gold-soft);color:var(--gold-ink)}
.scrim{display:none}
@media (max-width:900px){
  .tree{position:fixed;z-index:70;top:0;bottom:0;inset-inline-start:0;max-height:none;width:min(86vw,320px);border-radius:0 0 0 0;transform:translateX(105%);transition:transform .25s var(--ease-snap);padding-top:1rem;box-shadow:var(--shadow-lift)}
  .tree.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(30,25,15,.5);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{display:block;opacity:1;pointer-events:auto}
}

/* ---- קובץ מידע (לב העמוד) ---- */
.main{min-width:0;display:grid;gap:1rem}
.info{overflow:hidden;border-top:4px solid var(--sun)}
.info-h{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.85rem 1.1rem;background:linear-gradient(180deg,var(--gold-soft),transparent)}
.info-h h3{font-family:var(--font-hand);font-weight:400;font-size:1.55rem;line-height:1.1;color:var(--sea2)}
@media (prefers-color-scheme:dark){.info-h h3{color:#dbe3f7}}
.info-h .fname{font-family:var(--mono);font-size:.8rem;font-weight:700;background:var(--sea2);color:#fff;border-radius:.5rem;padding:.12rem .55rem;direction:ltr}
.upl{margin-inline-start:auto;display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:700;border-radius:99px;padding:.2rem .75rem}
.upl.ok{background:var(--oak-soft);color:var(--oak-deep)}
.upl.stale{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-bd)}
.upl.none{background:var(--pink-soft);color:var(--terra-deep)}
@media (prefers-color-scheme:dark){.upl.none{color:#f4a79c}}
.info-body{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1rem;padding:0 1.1rem 1.1rem}
@media (max-width:1100px){.info-body{grid-template-columns:minmax(0,1fr)}}
.paper{position:relative;border:1px solid var(--line);border-radius:.8rem;overflow:hidden;background:var(--paper)}
.paper::before{content:"";position:absolute;inset-block:0;inset-inline-start:2.4rem;width:1px;background:var(--margin);pointer-events:none;z-index:1}
.paper-scroll{max-height:290px;overflow:auto;scrollbar-width:thin;scrollbar-color:#3d4f7c transparent;
  background-image:repeating-linear-gradient(transparent 0 23px,var(--paper-rule) 23px 24px);background-attachment:local}
.paper.big .paper-scroll{max-height:none}
.paper pre{font-family:var(--mono);font-size:.88rem;font-weight:700;line-height:24px;padding:.35rem 3.3rem .35rem 1rem;white-space:pre-wrap;word-break:break-word;direction:rtl;text-align:right;color:var(--foreground)}
.paper pre .h{color:var(--sea2);font-weight:800;background:linear-gradient(transparent 55%,color-mix(in srgb,var(--sun) 45%,transparent) 55%)}
@media (prefers-color-scheme:dark){.paper pre .h{color:#dbe3f7}}
.paper pre .ok{color:var(--ok)} .paper pre .bad{color:var(--bad)} .paper pre .dim{color:var(--muted);font-weight:400}
.paper-more{position:absolute;inset-inline:0;bottom:0;display:flex;justify-content:center;padding:1.6rem 0 .45rem;background:linear-gradient(transparent,var(--paper) 70%);pointer-events:none}
.paper-more button{pointer-events:auto;font-size:.78rem;font-weight:700;color:var(--sea2);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.15rem .8rem;box-shadow:var(--shadow-soft)}
@media (prefers-color-scheme:dark){.paper-more button{color:#c9d5f3}}
.paper.big .paper-more{position:static;padding:.4rem;background:none}
.info-side{display:grid;gap:.6rem;align-content:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.stat{border-radius:.8rem;padding:.5rem .65rem;background:var(--line)}
.stat b{display:block;font-size:1.35rem;line-height:1.1;font-weight:800}
.stat span{font-size:.72rem;color:var(--muted);font-weight:600}
.stat.bad{background:var(--pink-soft)} .stat.bad b{color:var(--terra)}
.stat.good{background:var(--oak-soft)} .stat.good b{color:var(--oak-deep)}
.info-actions{display:grid;gap:.45rem}
.info-actions .btn{width:100%;justify-content:flex-start;padding:.5rem 1rem}
.info-actions .btn .ic{width:1.05rem;height:1.05rem}
.info-note{font-size:.74rem;color:var(--muted);line-height:1.45}
.info-note code{font-family:var(--mono);direction:ltr;unicode-bidi:embed;font-size:.72rem;background:var(--line);padding:0 .3rem;border-radius:.3rem}
.spin .ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- רשימת קבצים ---- */
.listcard{padding:.4rem .5rem .6rem;overflow:hidden}
.list-h{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.5rem .6rem}
.list-h h3{font-weight:800;font-size:1.05rem}
.toggle{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;margin-inline-start:auto}
.toggle input{accent-color:var(--sea)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:right;color:var(--muted);font-weight:700;font-size:.78rem;padding:.45rem .6rem;white-space:nowrap}
td{padding:.5rem .6rem;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--blue-soft)}
tbody tr.focus{box-shadow:inset -3px 0 0 var(--sun)}
tbody tr.dragging{opacity:.45}
tbody tr.dragover td{background:var(--gold-soft)}
td.c-chk,th.c-chk{width:2.2rem;padding-inline-end:.1rem}
td.c-ico{width:2.4rem;padding-inline:.2rem}
.chk{width:1.05rem;height:1.05rem;accent-color:var(--sea);cursor:pointer}
.fi{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.6rem;font-size:1rem}
.fi .ic{width:1.1rem;height:1.1rem}
.fi.folder{background:var(--gold-soft);color:var(--gold-ink)}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem .5rem;min-width:0}
.nm .t{font-weight:700;cursor:pointer;text-decoration:none}
.nm .t:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.nm .path{flex-basis:100%;font-size:.72rem;color:var(--muted)}

function renderAll() { renderTree(); renderCrumbs(); renderInfo(); renderList(); renderBulk(); renderPanel(); renderHeaderChips(); }

function renderHeaderChips() {
  const all = files.filter(f => !isArch(f.parent)).length;
  $("#totalChip").textContent = `${all} חומרים באתר · ${files.length - all} בארכיון`;
  const m = missingCount("root");
  $("#missChip").textContent = `${m} קבצים חסרים`;
}

function treeRow(id, depth) {
  const n = nodes[id], kids = n.children, open = S.exp.has(id), cnt = count(id), miss = n.type === "archive" ? 0 : missingCount(id);
  const icon = n.id === "arch" ? "📦" : n.type === "root" ? ico("drive") : ico(open && kids.length ? "folder-open" : "folder");
  const sep = id === "arch" ? '<li class="tsep" role="separator"></li>' : "";
  return `${sep}<li role="treeitem" aria-expanded="${kids.length ? open : "false"}"><div class="trow ${S.cur === id ? "on" : ""} ${id === "arch" ? "arch" : ""}" style="--d:${depth}" data-a="nav" data-id="${id}" data-drop="${id}" ${n.hint ? `title="${esc(n.hint)}"` : ""}>
    <button class="tog ${open ? "open" : ""} ${kids.length ? "" : "none"}" data-a="tog" data-id="${id}" aria-label="פתיחה/סגירה">${ico("chev")}</button>
    <span class="ticon">${icon}</span><span class="tname">${esc(n.name)}</span>
    ${miss ? `<span class="miss" title="${miss} קבצים צפויים חסרים">חסר ${miss}</span>` : ""}<span class="cnt">${cnt}</span></div>
    ${open && kids.length ? `<ul role="group">${kids.map(k => treeRow(k, depth + 1)).join("")}</ul>` : ""}</li>`;
}
function renderTree() {
  $("#tree").innerHTML = `<div class="tree-h">${ico("folder")}עץ התיקיות<span class="tiny"><button data-a="exp-all">פתח הכל</button><button data-a="exp-none">סגור</button></span></div><ul role="tree">${treeRow("root", 0)}</ul>`;
}

function renderCrumbs() {
  const p = [nodes.root, ...pathNodes(S.cur)];
  $("#crumbs").innerHTML = p.map((n, i) => {
    const last = i === p.length - 1;
    return `${i ? `<span class="sep">${ico("chev")}</span>` : ""}<button class="${last ? "last" : ""}" ${last ? "" : `data-a="nav" data-id="${n.id}" data-drop="${n.id}"`}>${i === 0 ? ico("drive") : ""}${esc(i === 0 ? "דרייב" : n.name)}</button>`;
  }).join("");
}

/* ---- קובץ המידע ---- */
function infoModel(id) {
  const n = nodes[id], L = [];
  const arch = isArch(id);
  const sub = new Set(descendants(id));
  const inSub = files.filter(f => sub.has(f.parent));
  const H = s => L.push({ t: "h", s }), P = s => L.push({ t: "ln", s }), OK = s => L.push({ t: "ok", s }), BAD = s => L.push({ t: "bad", s }), D = s => L.push({ t: "dim", s }), B = () => L.push({ t: "ln", s: "" });
  D("──────────────────────────────────────");
  D(` _מידע.txt · נוצר אוטומטית מנתוני האתר`);
  D(` ${fmtD(now(), true)} ${fmtT(now())} · אין לערוך ידנית`);
  D("──────────────────────────────────────"); B();
  H("פרטי התיקייה");
  P(`  שם:          ${n.id === "root" ? "חומרים לבגרות (שורש)" : n.name}`);
  P(`  סוג:         ${TYPE_HE[n.type]}`);
  P(`  נתיב באתר:   ${pathStr(id)}`);
  P(`  נתיב בדרייב: ${drivePath(id)}`);
  P(`  מזהה דרייב:  ${n.drive}`);
  const act = inSub.filter(f => f.status === "active").length, dr = inSub.filter(f => f.status === "draft").length, pa = inSub.filter(f => f.status === "paused").length;
  P(`  קבצים:       ${inSub.length}`);
  if (!arch) P(`  סטטוסים:     פעיל ${act}, טיוטה ${dr}, מושהה ${pa}`);
  if (n.children.length) P(`  תתי-תיקיות: ${n.children.length}`);
  const lm = lastMod(id); P(`  עודכן:       ${lm ? fmtD(lm, true) + " " + fmtT(lm) : "—"}`);
  B();

  if (arch) {
    H("סיבות העברה לארכיון");
    const g = { "arch-orph": 0, "arch-old": 0, "arch-unk": 0 }; inSub.forEach(f => g[f.parent]++);
    P(`  יתומים:         ${g["arch-orph"]}`); P(`  גרסאות ישנות:  ${g["arch-old"]}`); P(`  לא ברור:        ${g["arch-unk"]}`);
    B();
  } else {
    H("חסר");
    const chs = descendants(id).filter(c => nodes[c].type === "chapter");
    if (!chs.length) P("  אין פרקים בתיקייה זו.");
    else if (n.type === "chapter") {
      EXPECTED.forEach(k => files.some(f => f.parent === id && f.kind === k) ? OK(`  ✔ ${KINDS[k].label}`) : BAD(`  ✖ ${KINDS[k].label}  — חסר`));
      const extra = ["slides", "bagrut"].filter(k => files.some(f => f.parent === id && f.kind === k));
      if (extra.length) D(`  + בנוסף קיים: ${extra.map(k => KINDS[k].label).join(", ")}`);
    } else {
      chs.forEach(c => { const m = missingKinds(c); m.length ? BAD(`  ✖ ${nodes[c].lbl}: חסר ${m.map(k => KINDS[k].label).join(", ")}`) : OK(`  ✔ ${nodes[c].lbl}: הכול קיים`); });
    }
    B();
  }

  H("נוסף לאחרונה");
  const recent = [...inSub].filter(f => TODAY - f.added < 16 * 864e5).sort((a, b) => b.added - a.added).slice(0, 6);
  if (!recent.length) P("  לא נוספו קבצים ב-14 הימים האחרונים.");
  recent.forEach(f => P(`  ${fmtD(f.added)}  + ${f.name} — ${KINDS[f.kind].label}, ${ST[f.status]} — ${f.who}`));
  B();

  H("היסטוריית שמות והעברות");
  const evs = []; inSub.forEach(f => f.hist.forEach(e => { if (e.type !== "add") evs.push({ ...e, f }); }));
  evs.sort((a, b) => b.t - a.t);
  if (!evs.length) P("  אין שינויים.");
  evs.slice(0, 8).forEach(e => P(`  ${fmtD(e.t)}  ${evTextPlain(e)}${e.type === "rename" ? "" : `  [${e.f.name}]`}`));
  B();

  H("קבצים בארכיון");
  const archFiles = arch ? inSub : files.filter(f => isArch(f.parent) && f.from && sub.has(f.from));
  if (!archFiles.length) P("  אין.");
  archFiles.forEach(f => P(`  • ${f.name} — ${reasonOf(f).t}${f.from && !arch ? ` (מקור: ${nodes[f.from].name})` : ""}`));
  return { L, inSub, evs, archFiles, miss: arch ? 0 : missingCount(id) };
}
const infoPlain = m => m.L.map(l => l.s).join("\n");
const infoHtml = m => m.L.map(l => {
  const c = l.t === "ln" ? "" : ` class="${l.t}"`;
  return `<span${c}>${esc(l.s)}</span>`;
}).join("\n");

function renderInfo() {
  const id = S.cur, n = nodes[id], m = infoModel(id);
  const up = S.upl[id], rv = S.rev[id] || 0;
  let pill;
  if (!up) pill = `<span class="upl none">${ico("warn")}טרם הועלה לדרייב</span>`;
  else if (up.rev === rv) pill = `<span class="upl ok">${ico("check")}הקובץ בדרייב מעודכן · ${rel(up.t)} ${fmtT(up.t)}</span>`;
  else pill = `<span class="upl stale">${ico("warn")}בדרייב: לא מעודכן · ${rv - up.rev} שינויים מאז ${rel(up.t)}</span>`;
  const week = m.inSub.filter(f => TODAY - f.added < 7 * 864e5).length;
  const renames = m.evs.filter(e => e.type === "rename").length;
  $("#info").innerHTML = `
    <div class="info-h">${ico("notes").replace("class=\"ic ", "class=\"ic ")}<h3>קובץ מידע של התיקייה</h3><span class="fname">_מידע.txt</span>${pill}</div>
    <div class="info-body">
      <div class="paper ${S.infoBig ? "big" : ""}"><div class="paper-scroll"><pre dir="rtl">${infoHtml(m)}</pre></div>
        <div class="paper-more"><button data-a="info-expand">${S.infoBig ? "הקטן תצוגה ↑" : "הצג את כל הקובץ ↓"}</button></div></div>
      <div class="info-side">
        <div class="stats">
          ${isArch(id) ? `<div class="stat"><b>${m.inSub.length}</b><span>פריטים בארכיון</span></div>` : `<div class="stat ${m.miss ? "bad" : "good"}"><b>${m.miss}</b><span>${m.miss ? "קבצים חסרים" : "הכול קיים"}</span></div>`}
          <div class="stat"><b>${week}</b><span>נוספו השבוע</span></div>
          <div class="stat"><b>${renames}</b><span>שינויי שם</span></div>
          <div class="stat"><b>${isArch(id) ? m.inSub.filter(f => f.parent === "arch-old").length : m.archFiles.length}</b><span>${isArch(id) ? "גרסאות ישנות" : "בארכיון"}</span></div>
        </div>
        <div class="info-actions">
          <button class="btn btn-ghost" data-a="info-refresh" id="bRefresh">${ico("refresh")}רענן מהאתר</button>
          <button class="btn btn-primary" data-a="info-up" id="bUp">${ico("upload")}העלה לדרייב</button>
          <button class="btn btn-ghost" data-a="dlinfo">${ico("download")}הורד .txt</button>
        </div>
        <p class="info-note">יישמר בדרייב כ-<code>${esc(drivePath(id))}/_מידע.txt</code> ויחליף את הקובץ הקיים. האתר מקור האמת — העריכה תמיד מהאתר.</p>
      </div>
    </div>`;
}

/* ---- רשימה ---- */
function currentItems() {
  const q = S.q.trim().toLowerCase();
  if (q) {
    const hit = f => f.name.toLowerCase().includes(q) || oldNames(f).some(o => o.name.toLowerCase().includes(q));
    return { mode: "search", folders: Object.values(nodes).filter(n => n.id !== "root" && n.name.toLowerCase().includes(q)), files: files.filter(hit) };
  }
  const n = nodes[S.cur], rec = S.recursive || S.cur === "arch";
  return { mode: isArch(S.cur) ? "arch" : "dir", folders: n.children.map(c => nodes[c]), files: filesIn(S.cur, rec).sort((a, b) => b.added - a.added), rec };
}
const fileIcon = f => `<span class="fi ${KINDS[f.kind].cls}">${ico(KINDS[f.kind].ic)}</span>`;
const oldChip = f => { const o = oldNames(f); return o.length ? `<span class="old" tabindex="0" data-oldtip="${f.id}" data-a="hist" data-id="${f.id}">${ico("history")}<span>שם ישן: ${nh(o[0].name)}</span></span>` : ""; };

function renderList() {
  const it = currentItems(), el = $("#list");
  const arch = it.mode === "arch";
  const title = it.mode === "search" ? `תוצאות חיפוש: “${esc(S.q)}”` : arch ? `${nodes[S.cur].name} — פריטים בארכיון` : "תוכן התיקייה";
  const head = `<div class="list-h"><h3>${title}</h3><span class="chip chip-blue">${it.folders.length} תיקיות · ${it.files.length} קבצים</span>
    ${it.mode === "dir" && S.cur !== "arch" ? `<label class="toggle"><input type="checkbox" data-a="rec" ${S.recursive ? "checked" : ""}/>כולל תתי-תיקיות</label>` : ""}
    ${arch ? `<span class="toggle" style="cursor:default">${ico("restore")}שחזור מחזיר את הקובץ לתיקיית המקור</span>` : ""}</div>`;
  if (!it.folders.length && !it.files.length) { el.innerHTML = head + `<div class="empty">${it.mode === "search" ? "לא נמצאו תוצאות." : "התיקייה ריקה. גררי לכאן קבצים מהעץ או מתיקייה אחרת."}</div>`; return; }
  if (S.view === "grid") { el.innerHTML = head + renderGrid(it); return; }

  const ids = it.files.map(f => f.id), allSel = ids.length && ids.every(i => S.sel.has(i)), some = ids.some(i => S.sel.has(i));
  const folderRows = it.folders.map(n => {
    const miss = n.type === "archive" ? 0 : missingCount(n.id), lm = lastMod(n.id);
    return `<tr data-drop="${n.id}" data-a="nav" data-id="${n.id}" style="cursor:pointer">
      <td class="c-chk"></td><td class="c-ico"><span class="fi folder">${n.id === "arch" ? "📦" : ico("folder")}</span></td>
      <td><div class="nm"><span class="t">${esc(n.name)}</span>${miss ? `<span class="miss">חסר ${miss}</span>` : ""}${it.mode === "search" ? `<span class="path">${esc(pathStr(n.parent || "root"))}</span>` : ""}</div></td>
      ${arch ? `<td>${n.hint ? `<span class="muted" style="font-size:.78rem">${esc(n.hint)}</span>` : ""}</td>` : ""}
      <td class="c-kind"><span class="chip chip-gray kind">${TYPE_HE[n.type]}</span></td>${arch ? "" : `<td class="c-st"></td>`}
      <td class="c-size num">${count(n.id)} קבצים</td>${arch ? "" : `<td class="c-add"></td>`}<td class="c-mod num">${lm ? fmtD(lm) : ""}</td><td></td>${arch ? "<td></td>" : ""}</tr>`;
  }).join("");
  const fileRows = it.files.map(f => {
    const k = KINDS[f.kind], r = isArch(f.parent) ? reasonOf(f) : null;
    return `<tr draggable="true" data-file="${f.id}" class="${S.sel.has(f.id) ? "sel" : ""} ${S.active === f.id ? "focus" : ""}">
      <td class="c-chk"><input class="chk" type="checkbox" data-chk="${f.id}" ${S.sel.has(f.id) ? "checked" : ""} aria-label="בחירת ${esc(f.name)}"/></td>
      <td class="c-ico">${fileIcon(f)}</td>
      <td><div class="nm"><a class="t" data-a="open" data-id="${f.id}">${nh(f.name)}</a>${oldChip(f)}${it.mode === "search" ? `<span class="path">${esc(pathStr(f.parent))}</span>` : ""}</div></td>
      ${arch ? `<td>${r ? `<span class="reason ${r.c}">${esc(r.t)}</span>` : ""}</td>` : ""}
      <td class="c-kind"><span class="chip kind ${k.cls}">${k.label}</span></td>
      ${arch ? "" : `<td class="c-st"><span class="chip kind st-${f.status}">${ST[f.status]}</span></td>`}
      <td class="c-size num"><span class="sz">${fmtSize(f.size)}</span></td>
      ${arch ? "" : `<td class="c-add num" title="${rel(f.added)}">${fmtS(f.added)}<span class="sub">${f.who}</span></td>`}
      <td class="c-mod num">${arch ? fmtS(archivedAt(f)) : fmtS(f.modified)}<span class="sub">${arch ? rel(archivedAt(f)) : rel(f.modified)}</span></td>
      <td style="white-space:nowrap">${arch && f.from ? "" : ""}<button class="kebab" data-a="menu" data-id="${f.id}" aria-haspopup="menu" aria-label="פעולות">${ico("more")}</button></td>
      ${arch ? `<td>${isArch(f.parent) ? `<button class="btn btn-ghost btn-sm" data-a="restore" data-id="${f.id}">${ico("restore")}שחזר למקום</button>` : ""}</td>` : ""}</tr>`;
  }).join("");
  const reasonTh = arch ? `<th>${it.mode === "arch" && S.cur !== "arch" ? "סיבת העברה" : "סיבת העברה / הערה"}</th>` : "";
  el.innerHTML = head + `<div class="tbl-wrap"><table><thead><tr>
    <th class="c-chk"><input class="chk" type="checkbox" id="selAll" data-a="selall" ${allSel ? "checked" : ""} aria-label="בחירת הכול"/></th><th class="c-ico"></th><th>שם באתר</th>${reasonTh}<th class="c-kind">סוג</th>${arch ? "" : `<th class="c-st">סטטוס</th>`}
    <th class="c-size">גודל</th>${arch ? "" : `<th class="c-add">נוסף</th>`}<th class="c-mod">${arch ? "הועבר לארכיון" : "עודכן"}</th><th></th>${arch ? "<th></th>" : ""}</tr></thead>
    <tbody>${folderRows}${fileRows}</tbody></table></div>`;
  const sa = $("#selAll"); if (sa) sa.indeterminate = !allSel && some;
}

function renderGrid(it) {
  const fo = it.folders.map(n => `<div class="gcard" data-drop="${n.id}" data-a="nav" data-id="${n.id}"><span class="fi folder">${n.id === "arch" ? "📦" : ico("folder")}</span><div class="gn">${esc(n.name)}</div>

  const fi = it.files.map(f => {
    const k = KINDS[f.kind], r = isArch(f.parent) ? reasonOf(f) : null;

      <div class="gm"><span class="chip kind ${k.cls}">${k.label}</span>${r ? `<span class="reason ${r.c}">${esc(r.t)}</span>` : `<span class="chip kind st-${f.status}">${ST[f.status]}</span>`}</div>

}

/* ---------- פעולות ---------- */
function toast(msg, undo) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${msg}</span>${undo ? `<button>בטלי</button>` : ""}`;
  $("#toasts").appendChild(t);
  if (undo) t.querySelector("button").onclick = () => { undo(); t.remove(); };
  setTimeout(() => t.remove(), undo ? 6500 : 3800);

function moveFiles(ids, dest, opts = {}) {

document.addEventListener("drop", e => {
  if (!S.drag) return; const t = e.target.closest("[data-drop]"); if (!t) return; e.preventDefault();
  const dest = t.dataset.drop, ids = S.drag; S.drag = null; document.querySelectorAll(".dragover,.nodrop,.dragging").forEach(x => x.classList.remove("dragover", "nodrop", "dragging"));
  if (!touchable(dest)) { toast("אפשר לשחרר רק על יחידה, פרק או על _ארכיון."); return; }
  const n = moveFiles(ids, dest); if (!n) toast("הקבצים כבר נמצאים בתיקייה הזו");
});

renderAll();
})();
</script>
